name: Framewise Health
description: >-
  Framewise Health is an AI-native patient engagement platform (Y Combinator,
  Spring 2026) that converts a patient's medical records into personalized,
  clinically-reviewed educational videos. The platform pulls patient data from
  electronic health records over any FHIR R4 endpoint, generates discharge and
  treatment-adherence education tailored to the individual using institutional
  protocols and drug-information databases, and delivers it by SMS in 75+
  languages with no app and no login. It then tracks patient comprehension in
  real time, giving care teams engagement data to flag which patients need
  follow-up. Framewise integrates with Epic, Oracle Health (Cerner),
  Athenahealth, ModMed, eClinicalWorks, and NextGen, and is HIPAA and SOC 2
  compliant with an AWS BAA and end-to-end encryption. It targets hospitals,
  pharmaceutical companies, medical device manufacturers, and private clinics
  seeking to improve patient outcomes and medication adherence.
